<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do list</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <div class="header"><-- Simple To Do list --></div>
        <div class="showTask">
            <ul id="taskList"></ul>
        </div>
        <div class="inputTask">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button id="addTaskBtn" onclick="addToDo()">Add Task</button>
           
        </div>
    </div>



    <script src="./script.js"></script>
</body>
</html>
